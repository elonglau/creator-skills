<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>tech card template</title>
  <style>
    :root {
      --canvas-width: 1080px;
      --canvas-height: 1440px;
      --bg: #07090f;
      --panel: #0e131d;
      --panel-2: #111827;
      --ink: #f1fff7;
      --muted: #98a7b6;
      --line: rgba(57, 255, 136, 0.26);
      --line-soft: rgba(255, 255, 255, 0.08);
      --green: #39ff88;
      --pink: #ff4fd8;
      --cyan: #66d9ff;
      --mono: "JetBrains Mono", "SFMono-Regular", "Menlo", "Consolas", "Liberation Mono", monospace;
      --sans: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      width: var(--canvas-width);
      min-width: var(--canvas-width);
      height: var(--canvas-height);
      min-height: var(--canvas-height);
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
    }

    .canvas {
      position: relative;
      width: var(--canvas-width);
      height: var(--canvas-height);
      padding: 56px 58px 48px;
      overflow: hidden;
      background:
        linear-gradient(rgba(57, 255, 136, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57, 255, 136, 0.035) 1px, transparent 1px),
        radial-gradient(circle at 82% 13%, rgba(255, 79, 216, 0.18), transparent 28%),
        radial-gradient(circle at 14% 88%, rgba(57, 255, 136, 0.12), transparent 30%),
        linear-gradient(180deg, #080b12 0%, #05070c 100%);
      background-size: 42px 42px, 42px 42px, 100% 100%, 100% 100%, 100% 100%;
    }

    .canvas::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 0%, rgba(57, 255, 136, 0.06) 50%, transparent 100%),
        repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 5px);
      mix-blend-mode: screen;
      opacity: 0.74;
    }

    .workspace {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border: 1px solid var(--line);
      background: rgba(7, 9, 15, 0.72);
    }

    .topbar,
    .footer,
    .tabbar,
    .chips,
    .stat-grid {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar {
      height: 54px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: #0b1018;
      font-family: var(--mono);
      color: var(--muted);
    }

    .traffic {
      display: flex;
      gap: 9px;
      margin-right: 18px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--green);
    }

    .dot:nth-child(2) {
      background: var(--pink);
    }

    .dot:nth-child(3) {
      background: var(--cyan);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand strong {
      color: var(--ink);
      font-size: 15px;
      letter-spacing: 0.06em;
    }

    .brand span {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .page-index {
      color: var(--green);
      font-family: var(--mono);
      font-size: 15px;
    }

    .chips {
      gap: 10px;
    }

    .chip {
      height: 26px;
      padding: 0 12px;
      border: 1px solid rgba(255, 79, 216, 0.52);
      border-radius: 0;
      background: rgba(255, 79, 216, 0.10);
      color: var(--pink);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
    }

    .tabbar {
      height: 38px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line-soft);
      background: #080d14;
      justify-content: flex-start;
      gap: 10px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
    }

    .tab {
      height: 100%;
      padding: 0 16px;
      border-left: 1px solid var(--line-soft);
      border-right: 1px solid var(--line-soft);
      display: inline-flex;
      align-items: center;
      color: var(--green);
      background: #0d1420;
    }

    .content {
      position: absolute;
      left: 58px;
      right: 58px;
      top: 150px;
      bottom: 92px;
      z-index: 2;
    }

    .eyebrow {
      margin-bottom: 34px;
      color: var(--green);
      font-family: var(--mono);
      font-size: 16px;
      letter-spacing: 0.08em;
    }

    .eyebrow::before {
      content: "> ";
      color: var(--pink);
    }

    .headline {
      max-width: 850px;
      margin: 0;
      color: var(--ink);
      font-size: 66px;
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: 0;
    }

    .headline .accent {
      color: var(--green);
    }

    .headline .accent:nth-child(2n) {
      color: var(--pink);
    }

    .summary {
      max-width: 760px;
      margin-top: 42px;
      color: #d7e8df;
      font-size: 22px;
      line-height: 1.72;
      font-weight: 540;
    }

    .summary code,
    .body-item code {
      color: var(--green);
      font-family: var(--mono);
    }

    .media-stage {
      margin-top: 42px;
      padding: 0;
      border: 1px solid var(--line);
      background: #090d14;
    }

    .media-stage::before {
      content: "preview.asset";
      height: 34px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      align-items: center;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 13px;
    }

    .media-wrap {
      width: 540px;
      max-width: 100%;
      height: 700px;
      margin: 36px auto 30px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #05070c;
      overflow: hidden;
    }

    .media-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .media-caption {
      height: 50px;
      padding: 0 18px;
      border-top: 1px solid var(--line-soft);
      background: #0d131c;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 14px;
    }

    .media-caption code {
      color: var(--green);
      font-family: var(--mono);
    }

    .footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42px;
      padding: 0 18px;
      border-top: 1px solid var(--line);
      background: #0b1018;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 13px;
      z-index: 3;
    }

    .stat-grid {
      position: absolute;
      left: 58px;
      right: 58px;
      bottom: 78px;
      align-items: stretch;
      gap: 12px;
      z-index: 2;
    }

    .stat {
      width: 25%;
      padding: 15px 14px;
      border: 1px solid var(--line);
      background: #0b111a;
      font-family: var(--mono);
    }

    .stat dt {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 12px;
    }

    .stat dd {
      margin: 0;
      color: var(--green);
      font-size: 22px;
      font-weight: 800;
    }

    .card[data-variant="cover"] .content {
      top: 334px;
      bottom: 212px;
    }

    .card[data-variant="cover"] .headline {
      max-width: 860px;
      font-size: 72px;
    }

    .card[data-variant="cover"] .summary {
      max-width: 760px;
      padding-left: 20px;
      border-left: 3px solid var(--pink);
    }

    .card:not([data-card-type="cover"]) .brand {
      display: none;
    }

    .card:not([data-card-type="cover"]) .eyebrow {
      display: none;
    }

    .card:not([data-card-type="cover"]) .stat-grid {
      display: none;
    }

    .card[data-variant="image_page"] .content {
      top: 148px;
      bottom: 68px;
    }

    .card[data-variant="image_page"] .headline {
      max-width: 760px;
      font-size: 58px;
    }

    .card[data-variant="image_page"] .summary {
      max-width: 860px;
      margin-top: 34px;
      font-size: 19px;
    }

    .card[data-variant="text_page"] .content {
      top: 206px;
      bottom: 80px;
    }

    .card[data-variant="text_page"] .headline {
      max-width: 820px;
      font-size: 62px;
    }

    .card[data-variant="text_page"] .summary {
      max-width: 820px;
      margin-top: 66px;
      font-size: 28px;
      line-height: 1.62;
    }

    .card[data-variant="text_page"] .body-item {
      display: block;
      position: relative;
      margin-bottom: 24px;
      padding: 20px 22px 20px 44px;
      border: 1px solid var(--line);
      background: #0b111a;
    }

    .card[data-variant="text_page"] .body-item::before {
      content: "::";
      position: absolute;
      left: 16px;
      top: 22px;
      color: var(--pink);
      font-family: var(--mono);
      font-size: 18px;
    }

    .card[data-variant="summary"] .content {
      top: 286px;
      bottom: 106px;
    }

    .card[data-variant="summary"] .headline {
      max-width: 850px;
      font-size: 70px;
    }

    .card[data-variant="summary"] .summary {
      max-width: 760px;
      margin-top: 54px;
      font-size: 24px;
    }

    .card[data-variant="summary"] .body-item {
      display: block;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line-soft);
    }

    .card[data-variant="text_page"] .media-stage,
    .card[data-variant="summary"] .media-stage,
    .card[data-layout="no_media"] .media-stage {
      display: none;
    }
  </style>
</head>
<body>
  <main class="canvas card" id="card" data-card-type="cover" data-variant="cover" data-layout="no_media">
    <section class="workspace">
      <header class="topbar">
        <div class="brand">
          <div class="traffic">
            <i class="dot"></i>
            <i class="dot"></i>
            <i class="dot"></i>
          </div>
          <div class="brand-copy">
            <strong id="brandName">飞柳OnMyWay</strong>
            <span id="brandSubtitle">AI Lab · Code Notes</span>
          </div>
        </div>
        <div class="page-index" id="pageIndex">README.md</div>
        <div class="chips" id="chips" hidden></div>
      </header>

      <div class="tabbar">
        <span class="tab" id="activeTab">card.schema.ts</span>
        <span>template.tech</span>
        <span>render.png</span>
      </div>

      <section class="content">
        <div class="eyebrow" id="eyebrow">tech.card / dark ide / v1</div>
        <h1 class="headline" id="headline">
          <span class="accent">黑色 IDE</span><br>风格信息卡模板。
        </h1>
        <p class="summary" id="summary">
          黑底、荧光绿、粉红强调，取消卡片阴影，使用代码编辑器式结构承载信息。
        </p>

        <figure class="media-stage" id="mediaStage" hidden>
          <div class="media-wrap">
            <img id="mediaImage" alt="">
          </div>
          <figcaption class="media-caption">
            <code id="mediaCode">asset-01</code>
            <span id="mediaCaption">runtime.preview</span>
          </figcaption>
        </figure>
      </section>

      <dl class="stat-grid" id="stats"></dl>

      <footer class="footer" id="footer">
        <span id="footerLeft">飞柳OnMyWay · AI Lab</span>
        <span id="footerRight">main · ready</span>
      </footer>
    </section>
  </main>

  <script>
    window.TEMPLATE_CONFIG = window.TEMPLATE_CONFIG || {
      style: "tech",
      canvas: {
        width: 1080,
        height: 1440,
        ratio: "3:4"
      },
      brand: {
        name: "飞柳OnMyWay",
        subtitle: "AI Lab · Code Notes"
      },
      accentColor: "#39ff88",
      secondaryColor: "#ff4fd8",
      variants: ["cover", "image_page", "text_page", "summary"],
      defaultVariant: "image_page"
    };

    window.CARD_DATA = window.CARD_DATA || {
      type: "cover",
      variant: "cover",
      layout: "no_media",
      brand: {
        name: window.TEMPLATE_CONFIG.brand.name,
        subtitle: window.TEMPLATE_CONFIG.brand.subtitle
      },
      page: {
        current: "README.md",
        total: "11"
      },
      chips: [],
      eyebrow: "tech.card / dark ide / v1",
      headline: [
        { text: "黑色 IDE", accent: true },
        { text: "风格信息卡模板。" }
      ],
      body: [
        "黑底、荧光绿、粉红强调，取消卡片阴影，使用代码编辑器式结构承载信息。"
      ],
      media: null,
      footer: {
        left: window.TEMPLATE_CONFIG.brand.name + " · AI Lab",
        right: "main · ready"
      },
      stats: [
        { label: "theme", value: "dark" },
        { label: "accent", value: "green" },
        { label: "hot", value: "pink" },
        { label: "shadow", value: "off" }
      ]
    };

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderHeadline(parts) {
      if (!Array.isArray(parts)) {
        return escapeHtml(parts || "");
      }

      return parts.map(function(part, index) {
        var text = escapeHtml(part.text || "");
        var className = part.accent ? " class=\"accent\"" : "";
        var prefix = index > 0 ? "<br>" : "";
        return prefix + "<span" + className + ">" + text + "</span>";
      }).join("");
    }

    function getVariant(data) {
      if (data.variant) {
        return data.variant;
      }

      if (data.type === "cover") {
        return "cover";
      }

      if (data.type === "summary") {
        return "summary";
      }

      if (data.media) {
        return "image_page";
      }

      if (data.type === "point" || data.type === "steps" || data.type === "quote") {
        return "text_page";
      }

      return window.TEMPLATE_CONFIG.defaultVariant || "image_page";
    }

    function renderBody(items) {
      var bodyItems = Array.isArray(items) ? items : [items || ""];
      return bodyItems.map(function(item) {
        return "<span class=\"body-item\">" + escapeHtml(item) + "</span>";
      }).join("");
    }

    function render() {
      var data = window.CARD_DATA;
      var card = document.getElementById("card");
      var type = data.type || "point";
      var variant = getVariant(data);
      var layout = data.layout || (variant === "image_page" && data.media ? "image_bottom" : "no_media");

      card.dataset.cardType = type;
      card.dataset.variant = variant;
      card.dataset.layout = layout;

      var config = window.TEMPLATE_CONFIG || {};
      var defaultBrand = config.brand || {};
      var brandName = data.brand && data.brand.name ? data.brand.name : (defaultBrand.name || "飞柳OnMyWay");
      var brandSubtitle = data.brand && data.brand.subtitle ? data.brand.subtitle : (defaultBrand.subtitle || "");

      document.getElementById("brandName").textContent = brandName;
      document.getElementById("brandSubtitle").textContent = brandSubtitle;
      var pageIndex = document.getElementById("pageIndex");
      pageIndex.textContent = data.page && data.page.current ? data.page.current : "";
      pageIndex.hidden = !(data.page && data.page.current);
      document.getElementById("eyebrow").textContent = data.eyebrow || "";
      document.getElementById("headline").innerHTML = renderHeadline(data.headline || "");
      document.getElementById("summary").innerHTML = renderBody(data.body || []);

      var chips = document.getElementById("chips");
      chips.innerHTML = "";
      (data.chips || []).forEach(function(label) {
        var chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = label;
        chips.appendChild(chip);
      });
      chips.hidden = !data.chips || data.chips.length === 0;

      var mediaStage = document.getElementById("mediaStage");
      if (data.media && data.media.src) {
        document.getElementById("mediaImage").src = data.media.src;
        document.getElementById("mediaImage").alt = data.media.alt || "";
        document.getElementById("mediaCode").textContent = data.media.code || data.media.id || "asset";
        document.getElementById("mediaCaption").textContent = data.media.caption || data.media.alt || "";
        mediaStage.hidden = false;
      } else {
        mediaStage.hidden = true;
      }

      var stats = document.getElementById("stats");
      stats.innerHTML = "";
      (data.stats || []).forEach(function(item) {
        var wrapper = document.createElement("div");
        wrapper.className = "stat";
        wrapper.innerHTML = "<dt>" + escapeHtml(item.label || "") + "</dt><dd>" + escapeHtml(item.value || "") + "</dd>";
        stats.appendChild(wrapper);
      });

      document.getElementById("footerLeft").textContent = data.footer && data.footer.left ? data.footer.left : brandName;
      document.getElementById("footerRight").textContent = data.footer && data.footer.right ? data.footer.right : "";
    }

    render();
  </script>
</body>
</html>
